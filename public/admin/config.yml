# Sveltia CMS (a modern, actively maintained, Decap-config-compatible git
# CMS). Edits are plain commits to this same GitHub repo — no database, no
# separate CMS server. See docs/cms-editing-guide.md for the owner-facing
# setup/editing guide and docs/cms-architecture.md for how this is wired up
# and how to reuse it for another site.
backend:
  name: github
  repo: yatanco/livingrhea-astro
  branch: astro-headless-migration
  # A small, open-source, shared OAuth helper (github.com/sveltia/sveltia-cms-auth)
  # deployed on Cloudflare Workers — not a hosted SaaS, not this repo's build.
  # The same worker can authenticate other sites too; each site's own backend.repo
  # here is what scopes it to this repo.
  base_url: https://sveltia-cms-auth.haneen.workers.dev

# Every edit becomes its own draft (a separate branch + a Pull Request Sveltia
# manages) instead of committing straight to the production branch, so a
# change is always a reviewable preview, never an instant live publish.
publish_mode: editorial_workflow

media_folder: public/uploads
public_folder: /uploads

site_url: https://livingrhea.com
display_url: https://livingrhea.com
logo_url: /wp-content/uploads/2025/04/cropped-LivingRheaLogo-192x192.png

collections:
  - name: posts
    label: Blog posts
    label_singular: Post
    folder: src/content/posts
    extension: md
    format: frontmatter
    create: true
    slug: "{{slug}}"
    summary: "{{title}} — {{pubDate}}"
    sortable_fields: [pubDate, title]
    view_filters:
      - label: Drafts only
        field: draft
        pattern: "true"
      - label: Published only
        field: draft
        pattern: "false"
    fields:
      - { label: Title, name: title, widget: string }
      - { label: "Excerpt / description", name: description, widget: text }
      - { label: "Publish date", name: pubDate, widget: datetime }
      - {
          label: "Updated date",
          name: updatedDate,
          widget: datetime,
          required: false,
        }
      - { label: Author, name: author, widget: string, default: "Rhea Mehta" }
      - label: Categories
        name: categories
        widget: list
        required: false
        fields:
          - { label: Name, name: name, widget: string }
          - {
              label: "Slug (lowercase, hyphens only, e.g. scientific-wellness)",
              name: slug,
              widget: string,
            }
      - label: "Featured image"
        name: featuredImage
        widget: image
        required: false
        # Relative, not absolute — Astro's image() schema helper resolves this
        # the same way it resolves every migrated post's existing featuredImage
        # (e.g. "../../assets/migrated/.../photo.webp"): as a real source file
        # it optimizes at build time (AVIF/WebP, responsive sizes), not a plain
        # served URL. Leaving public_folder unset makes it default to this same
        # relative value, so the frontmatter gets a path Astro can resolve
        # instead of a /uploads/... URL a plain <img> would need.
        media_folder: "../../assets/uploads/posts"
        hint: >-
          Upload a photo here — it goes through the same automatic
          optimization (AVIF/WebP, responsive sizes) as every existing post's
          image, not a plain file.
      - {
          label: "Featured image alt text",
          name: featuredImageAlt,
          widget: string,
          required: false,
          default: "",
        }
      - {
          label: "Save as draft (hidden from the live site)",
          name: draft,
          widget: boolean,
          default: false,
        }
      # Preserved verbatim, not shown: the original WordPress post id/URL
      # used for redirects and structured data, and the legacy plain-URL
      # image path migrated posts carry for their social-share fallback.
      # Declaring them (even hidden) stops the CMS from silently dropping
      # them when a migrated post is edited.
      - { name: legacyFeaturedImage, widget: hidden, required: false }
      - { name: legacyId, widget: hidden, required: false }
      - { name: legacyUrl, widget: hidden, required: false }
      - { label: "Post body", name: body, widget: markdown }

  - name: pages
    label: "Main pages"
    label_singular: Page
    files:
      - file: src/content/pages/home.md
        label: Home
        name: home
        fields: &page_fields_with_hero
          - { label: "Page title", name: title, widget: string }
          - {
              label: "Meta description (used for search engines, not shown on the page)",
              name: description,
              widget: text,
            }
          - { name: path, widget: hidden }
          - { name: labels, widget: hidden }
          - { name: hero, widget: hidden }
          - name: body
            widget: hidden
            # The page's text is chunked by "# section-..." headings that
            # src/lib/page-sections.js splits and injects into fixed layout
            # positions — not plain prose. Editing it safely needs labeled,
            # structured fields (one per section) instead of raw markdown
            # with a convention a non-technical editor can accidentally
            # break; that restructuring is tracked separately
            # (docs/native-content-target.md). Hidden here only preserves
            # the existing text unchanged when title/description are
            # edited — it does not expose it for editing.
      - file: src/content/pages/about.md
        label: About
        name: about
        fields: &page_fields
          - { label: "Page title", name: title, widget: string }
          - {
              label: "Meta description (used for search engines, not shown on the page)",
              name: description,
              widget: text,
            }
          - { name: path, widget: hidden }
          - { name: labels, widget: hidden }
          - name: body
            widget: hidden
            # The page's text is chunked by "# section-..." headings that
            # src/lib/page-sections.js splits and injects into fixed layout
            # positions — not plain prose. Editing it safely needs labeled,
            # structured fields (one per section) instead of raw markdown
            # with a convention a non-technical editor can accidentally
            # break; that restructuring is tracked separately
            # (docs/native-content-target.md). Hidden here only preserves
            # the existing text unchanged when title/description are
            # edited — it does not expose it for editing.
      - file: src/content/pages/coaching.md
        label: Coaching
        name: coaching
        fields: *page_fields
      - file: src/content/pages/contact.md
        label: Contact
        name: contact
        fields: *page_fields
      - file: src/content/pages/himalayan-breathwork.md
        label: "Himalayan Breathwork"
        name: himalayan-breathwork
        fields: *page_fields
      - file: src/content/pages/music.md
        label: Music
        name: music
        fields: *page_fields
      - file: src/content/pages/press.md
        label: Press
        name: press
        fields: *page_fields
      - file: src/content/pages/smoothie-movement.md
        label: "Smoothie Movement"
        name: smoothie-movement
        fields: *page_fields
