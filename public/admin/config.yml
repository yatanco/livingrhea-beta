backend:
  name: turbo-github
  turbo_site_id: 19346064-1322-4ff7-a71f-c72e01d44608
  branch: astro-headless-migration
site_url: https://livingrhea.com
display_url: https://livingrhea.com
logo_url: ""
media_folder: public/media/editor
public_folder: /media/editor
collections:
  - name: pages
    label: Pages
    folder: src/content/pages
    extension: json
    format: json
    create: true
    slug: "{{slug}}"
    identifier_field: title
    preview_path: "{{slug}}/"
    fields:
      - { label: Title, name: title, widget: string }
      - {
          label: URL slug,
          name: slug,
          widget: string,
          hint: "Keep existing slugs to preserve links. Homepage slug is livingrhea-com.",
        }
      - {
          label: Search description,
          name: description,
          widget: text,
          required: false,
        }
      - { label: Published, name: date, widget: datetime }
      - { label: Updated, name: updated, widget: datetime, required: false }
      - { label: Cover image, name: hero, widget: image, required: false }
      - {
          label: Image description,
          name: heroAlt,
          widget: string,
          required: false,
        }
      - { label: Content, name: body, widget: richtext }
  - name: posts
    label: Journal posts
    folder: src/content/posts
    extension: json
    format: json
    create: true
    slug: "{{slug}}"
    identifier_field: title
    preview_path: "blog/{{slug}}/"
    fields:
      - { label: Title, name: title, widget: string }
      - {
          label: URL slug,
          name: slug,
          widget: string,
          hint: "Use lowercase words separated by hyphens.",
        }
      - {
          label: Search description,
          name: description,
          widget: text,
          required: false,
        }
      - { label: Published, name: date, widget: datetime }
      - { label: Updated, name: updated, widget: datetime, required: false }
      - { label: Cover image, name: hero, widget: image, required: false }
      - {
          label: Image description,
          name: heroAlt,
          widget: string,
          required: false,
        }
      - { label: Content, name: body, widget: richtext }
  - name: settings
    label: Site settings
    files:
      - name: site
        label: Forms and social links
        file: src/content/settings/site.json
        fields:
          - {
              label: Default search description,
              name: description,
              widget: text,
            }
          - { label: Instagram URL, name: instagram, widget: string }
          - {
              label: Contact form endpoint,
              name: contactFormAction,
              widget: string,
              required: false,
              hint: "A verified hosted form endpoint, for example Formspree. Leave empty to show the contact fallback.",
            }
          - {
              label: Mailchimp signup endpoint,
              name: newsletterAction,
              widget: string,
            }
          - {
              label: Mailchimp bot-trap field name,
              name: newsletterHoneypot,
              widget: string,
            }
      - name: home
        label: Homepage introduction
        file: src/content/settings/home.json
        fields:
          - { label: Small heading, name: eyebrow, widget: string }
          - { label: Main headline, name: headline, widget: string }
          - { label: Italic headline, name: subheadline, widget: string }
          - { label: Introduction, name: intro, widget: text }
          - { label: Button text, name: buttonLabel, widget: string }
          - { label: Button link, name: buttonHref, widget: string }
